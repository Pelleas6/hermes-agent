name: Unpack industrial observability bundle

on:
  push:
    branches: [feature/industrial-observability]
    paths:
      - .build/observability-bundle.b64.part*
      - .github/workflows/unpack-observability-bundle.yml

permissions:
  contents: write

concurrency:
  group: unpack-industrial-observability
  cancel-in-progress: false

jobs:
  unpack:
    if: ${{ !contains(github.event.head_commit.message, '[bundle-unpacked]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/industrial-observability

      - name: Rebuild and verify bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib

          expected = "02effb1d22ab25c1cb7173a4a68834fde12f983ace456799998ac95747300ee5"
          alphabet = set("ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=")
          paths = sorted(Path(".build").glob("observability-bundle.b64.part*"))
          if not paths:
              raise SystemExit("No bundle chunks found")
          chunks = ["".join(ch for ch in path.read_text(encoding="utf-8") if ch in alphabet) for path in paths]

          def decode_and_match(raw: str):
              try:
                  payload = base64.b64decode(raw, validate=True)
              except Exception:
                  return None
              return payload if hashlib.sha256(payload).hexdigest() == expected else None

          joined = "".join(chunks)
          payload = decode_and_match(joined)
          if payload is None and len(chunks[0]) == 8001:
              first = chunks[0]
              tail = "".join(chunks[1:])
              for index in range(len(first)):
                  payload = decode_and_match(first[:index] + first[index + 1:] + tail)
                  if payload is not None:
                      print(f"Recovered one transport character at part00 offset {index}")
                      break
          if payload is None:
              raise SystemExit("Bundle checksum recovery failed")
          Path("/tmp/observability.tar.gz").write_bytes(payload)
          print(f"Verified bundle: {len(payload)} bytes")
          PY
          echo "02effb1d22ab25c1cb7173a4a68834fde12f983ace456799998ac95747300ee5  /tmp/observability.tar.gz" | sha256sum -c -
          tar -tzf /tmp/observability.tar.gz
          tar -xzf /tmp/observability.tar.gz
          rm -rf .build
          rm -f .github/workflows/unpack-observability-bundle.yml

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            plugins/task-metrics \
            skills/productivity/task-time-metrics/scripts \
            ops/observability
          bash -n ops/observability/install_vps.sh
          python -m unittest discover -s tests -p 'test_task_metrics_plugin.py' -v
          python -m unittest discover -s tests -p 'test_task_time_tracker.py' -v
          python -m unittest discover -s tests -p 'test_ops_observability.py' -v

      - name: Commit unpacked source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: unpack industrial observability source [bundle-unpacked]"
          git push origin HEAD:feature/industrial-observability
